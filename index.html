<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102d2b" />
    <meta name="description" content="2026년 12월 10일부터 13일까지의 후쿠오카 여행 일정" />
    <link rel="manifest" href="/fukuoka/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/fukuoka/icons/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/fukuoka/icons/apple-touch-icon.png" />
    <title>후쿠오카, 지금 여기</title>
    <style>
      :root{--ink:#152724;--deep:#102d2b;--green:#1f514b;--paper:#f6f2e8;--red:#e4563f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--deep);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}.instant-lock{display:grid;place-items:center;min-height:100svh;padding:24px 18px;background:radial-gradient(circle at 15% 10%,rgba(245,199,102,.2),transparent 19rem),radial-gradient(circle at 92% 90%,rgba(228,86,63,.17),transparent 18rem),var(--deep)}.instant-card{position:relative;overflow:hidden;width:min(100%,400px);padding:35px 25px 25px;color:var(--ink);background:var(--paper);border-radius:8px 32px 32px 32px;box-shadow:0 30px 90px rgba(0,0,0,.3);text-align:center}.instant-card:before{content:"";position:absolute;top:-90px;right:-75px;width:190px;height:190px;border:1px solid rgba(31,81,75,.13);border-radius:50%;box-shadow:0 0 0 25px rgba(31,81,75,.035),0 0 0 50px rgba(31,81,75,.025)}.instant-stamp{position:relative;z-index:1;display:grid;place-items:center;width:62px;height:68px;margin:0 auto 20px;color:#fff;background:var(--red);border-radius:5px 5px 20px 5px;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(228,86,63,.22)}.instant-stamp span{margin-top:7px;font-size:8px;font-weight:900;letter-spacing:.18em;opacity:.8}.instant-stamp strong{margin-top:-8px;font-family:Georgia,serif;font-size:28px}.instant-eyebrow{margin:0 0 5px;color:var(--red);font-size:9px;font-weight:900;letter-spacing:.15em}.instant-card h1{margin:0;font-size:30px;letter-spacing:-.055em}.instant-copy{margin:12px 0 25px;color:#697671;font-size:13px;line-height:1.65}.instant-card label{display:block;margin:0 0 7px;color:#6d7a75;font-size:10px;font-weight:800;text-align:left}.instant-input{position:relative;height:62px;background:#e9ece6;border:1px solid #d7dcd4;border-radius:15px}.instant-input:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(31,81,75,.09)}.instant-input.error{border-color:var(--red)}.instant-input input{position:absolute;inset:0;z-index:2;width:100%;height:100%;opacity:0;cursor:text}.instant-dots{display:flex;align-items:center;justify-content:center;gap:20px;height:100%}.instant-dots i{width:12px;height:12px;background:#c2cac5;border-radius:50%;transition:.16s ease}.instant-dots i.filled{background:var(--green);transform:scale(1.12);box-shadow:0 0 0 4px rgba(31,81,75,.09)}.instant-message{min-height:16px;margin:7px 0 11px;color:#8e9894;font-size:10px}.instant-input.error+.instant-message{color:var(--red)}.instant-footnote{margin:15px 0 0;color:#929c98;font-size:9px}
    </style>
    <style>
      :root{--signal:#70c9a9;--gold:#d5a84e}.instant-lock{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 50% 22%,rgba(112,201,169,.14),transparent 20rem),radial-gradient(circle at 80% 86%,rgba(213,168,78,.12),transparent 18rem),linear-gradient(rgba(112,201,169,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(112,201,169,.035) 1px,transparent 1px),linear-gradient(155deg,#0c2422 0%,#102d2b 58%,#173c37 100%);background-size:auto,auto,30px 30px,30px 30px,auto}.instant-lock:before{content:"";position:absolute;z-index:-1;top:12%;left:50%;width:min(86vw,540px);aspect-ratio:1;border:1px solid rgba(112,201,169,.09);border-radius:50%;box-shadow:0 0 0 42px rgba(112,201,169,.025),0 0 0 84px rgba(112,201,169,.018);transform:translateX(-50%)}.instant-card{overflow:visible;padding:33px 24px 23px;background:linear-gradient(135deg,rgba(255,255,255,.76),transparent 38%),var(--paper);border:1px solid rgba(255,255,255,.64);border-radius:22px;box-shadow:0 28px 80px rgba(2,19,18,.38),0 0 0 1px rgba(112,201,169,.08)}.instant-card:before{top:-1px;right:24px;left:24px;width:auto;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--signal),transparent);border:0;border-radius:99px;box-shadow:0 0 16px rgba(112,201,169,.32)}.instant-card:after{content:"FUKUOKA / DEC 10—13";position:absolute;top:13px;right:15px;color:rgba(31,81,75,.46);font-size:6px;font-weight:900;letter-spacing:.13em}.instant-stamp{width:68px;height:68px;margin-bottom:18px;background:linear-gradient(var(--deep),var(--deep)) padding-box,conic-gradient(from 35deg,var(--signal),rgba(112,201,169,.08) 38%,var(--gold) 62%,var(--signal)) border-box;border:1px solid transparent;border-radius:50%;box-shadow:inset 0 0 0 7px rgba(112,201,169,.06),0 0 0 7px rgba(112,201,169,.055),0 11px 26px rgba(16,45,43,.22);transform:none}.instant-stamp:before,.instant-stamp:after{content:"";position:absolute;border-radius:50%}.instant-stamp:before{inset:9px;border:1px solid rgba(112,201,169,.25)}.instant-stamp:after{top:8px;right:9px;width:5px;height:5px;background:var(--gold);box-shadow:0 0 10px rgba(213,168,78,.72)}.instant-stamp span{margin-top:8px;color:var(--signal);font-size:7px}.instant-stamp strong{margin-top:-7px;font-family:inherit;font-size:23px;letter-spacing:-.06em}.instant-eyebrow{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--green);letter-spacing:.11em}.instant-eyebrow i{width:6px;height:6px;background:var(--signal);border-radius:50%;box-shadow:0 0 0 3px rgba(112,201,169,.14),0 0 9px rgba(112,201,169,.6)}.instant-card h1{font-size:29px}.instant-copy{margin-bottom:22px}.instant-card label{margin-left:2px;color:var(--green);font-size:9px;letter-spacing:.04em}.instant-input{height:60px;overflow:hidden;background:rgba(231,238,232,.78);border-color:#cfd9d3;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.76)}.instant-input:after{content:"";position:absolute;right:13px;bottom:7px;left:13px;height:1px;background:linear-gradient(90deg,transparent,rgba(31,81,75,.15),transparent)}.instant-input:focus-within{border-color:#77a99a;box-shadow:0 0 0 3px rgba(112,201,169,.12),inset 0 1px 0 #fff}.instant-dots{gap:18px}.instant-dots i{width:13px;height:13px;background:transparent;border:1px solid #9fb0aa;border-radius:4px;transform:rotate(45deg)}.instant-dots i.filled{background:var(--green);border-color:var(--green);border-radius:4px;box-shadow:0 0 0 3px rgba(112,201,169,.14),0 0 10px rgba(112,201,169,.36);transform:rotate(45deg) scale(1.04)}.instant-message{margin-bottom:8px}.instant-footnote{color:#788681}.instant-footnote span{color:var(--signal);font-size:6px;text-shadow:0 0 6px rgba(112,201,169,.55)}@media(max-width:390px){.instant-card{padding-inline:20px}.instant-card:after{display:none}}
    </style>
    <script type="module" crossorigin src="/fukuoka/assets/app-v62.js"></script>
  </head>
  <body>
    <div id="root">
      <main class="instant-lock" id="instant-pin-shell">
        <section class="instant-card">
          <div class="instant-stamp" aria-hidden="true"><span>FUK</span><strong>26</strong></div>
          <p class="instant-eyebrow"><i aria-hidden="true"></i>TRIP PILOT · SECURE ACCESS</p>
          <h1>후쿠오카 여행</h1>
          <p class="instant-copy">여행 시스템에 연결하려면<br />4자리 PIN을 입력해 주세요.</p>
          <form id="instant-pin-form">
            <label for="instant-trip-pin">접속 PIN</label>
            <div class="instant-input" id="instant-pin-wrap">
              <input id="instant-trip-pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" autofocus />
              <div class="instant-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            </div>
            <p class="instant-message" id="instant-pin-message" aria-live="polite">4번째 숫자를 입력하면 자동으로 열립니다.</p>
          </form>
          <p class="instant-footnote"><span aria-hidden="true">●</span> 브라우저를 닫으면 자동으로 잠깁니다.</p>
        </section>
      </main>
    </div>
  </body>
</html>
